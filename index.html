<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>안양 푸드뱅크</title>

  <meta name="description"
        content="안양 푸드뱅크 공식 홈페이지입니다. 식품기부, 이용안내, 자원봉사 및 지역사회 나눔 활동을 안내합니다.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #262626;
      background: #faf8f3;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .test-box {
      width: 100%;
      max-width: 700px;
      padding: 60px 30px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.06);
    }

    .label {
      color: #f79400;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 15px 0;
      font-size: 42px;
    }

    p {
      margin: 0;
      color: #666;
      font-size: 18px;
      line-height: 1.7;
    }

    .success {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 22px;
      border-radius: 30px;
      background: #285a35;
      color: #fff;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .test-box {
        padding: 45px 20px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<main>
  <section class="test-box">

    <div class="label">
      ANYANG FOOD BANK
    </div>

    <h1>
      안양 푸드뱅크
    </h1>

    <p>
      당신의 작은 나눔이 따뜻한 안양을 만듭니다.<br>
      공식 홈페이지를 준비하고 있습니다.
    </p>

    <div class="success">
      GitHub Pages 테스트
    </div>

  </section>
</main>

</body>
</html>
